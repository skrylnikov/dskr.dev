name: dskr-dev

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    entrypoint: []
    command: pnpm dev --force --host 0.0.0.0
    environment:
      NODE_ENV: development
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - node-modules:/workspace/node_modules
      - ${PNPM_STORE_DIR:-/srv/pnpm/store}:/pnpm-store
    ports:
      - 127.0.0.1:14321:4321
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4321/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    entrypoint: []
    command: sh -c 'pnpm indie:migrate && exec pnpm indie:dev'
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: development
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - node-modules:/workspace/node_modules
      - ${PNPM_STORE_DIR:-/srv/pnpm/store}:/pnpm-store
    ports:
      - 127.0.0.1:14322:4322
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4322/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  dev-agent:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    working_dir: /workspace
    environment:
      MULTICA_DAEMON_MAX_CONCURRENT_TASKS: 1
      MULTICA_WORKSPACES_ROOT: /workspace
    volumes:
      - ..:/workspace
      - node-modules:/workspace/node_modules
      - ${PNPM_STORE_DIR:-/srv/pnpm/store}:/pnpm-store
      - agent-home:/home/node
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  agent-home:
  node-modules:
  postgres-data:
