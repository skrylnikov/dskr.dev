server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Vite fingerprints these files, so a new font gets a new URL.
    location ~ ^/_astro/.+\.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
